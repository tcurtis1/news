<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="yoyosup">
  <title>yoyosup</title>
  <!-- Compass / star mark — favicon & header (chalk tile) -->
  <rect width="64" height="64" rx="14" fill="#fafafa"/>
  <!-- Outer ring -->
  <circle cx="32" cy="32" r="24" fill="none" stroke="#0a0a0b" stroke-width="2.6"/>
  <!-- 8-point compass rose (long N/E/S/W, short diagonals) -->
  <path fill="#0a0a0b"
    d="M32 9 L37.6 26.4 L55 32 L37.6 37.6 L32 55 L26.4 37.6 L9 32 L26.4 26.4 Z"/>
  <!-- Orange north tip -->
  <path fill="#f97316" d="M32 9 L37.6 26.4 L32 32 L26.4 26.4 Z"/>
  <!-- Hub -->
  <circle cx="32" cy="32" r="5.5" fill="#fafafa"/>
  <circle cx="32" cy="32" r="2.5" fill="#0a0a0b"/>
</svg>
