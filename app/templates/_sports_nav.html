<nav class="sports-leagues" aria-label="Sports leagues">
  <a href="/sports"{% if not active_league %} aria-current="page"{% endif %}>Top</a>
  {% for league in leagues %}
    <a href="/sports/{{ league.slug }}"{% if active_league == league.slug %} aria-current="page"{% endif %}>{{ league.short_name }}</a>
  {% endfor %}
</nav>
{% if has_rankings and active_league %}
<nav class="sports-view-nav" aria-label="College scores or Top 25">
  <a href="/sports/{{ active_league }}"{% if rankings_view != "top25" %} aria-current="page"{% endif %}>Scores</a>
  <a href="/sports/{{ active_league }}/top25"{% if rankings_view == "top25" %} aria-current="page"{% endif %}>Top 25</a>
</nav>
{% endif %}
